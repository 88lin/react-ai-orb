  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="160" cy="60" r="280" fill="url(#neb1)" filter="url(#b24)"/>
  <circle cx="1080" cy="300" r="300" fill="url(#neb2)" filter="url(#b24)"/>
  <circle cx="640" cy="180" r="360" fill="url(#neb3)" filter="url(#b24)"/>

  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1" opacity="0.5"/><circle cx="120" cy="200" r="0.7" opacity="0.35"/>
    <circle cx="200" cy="300" r="1.1" opacity="0.45"/><circle cx="380" cy="50" r="0.8" opacity="0.4"/>
    <circle cx="440" cy="280" r="0.7" opacity="0.3"/><circle cx="520" cy="90" r="1" opacity="0.5"/>
    <circle cx="600" cy="40" r="0.6" opacity="0.3"/><circle cx="700" cy="300" r="1" opacity="0.4"/>
    <circle cx="780" cy="60" r="0.8" opacity="0.45"/><circle cx="860" cy="250" r="0.7" opacity="0.35"/>
    <circle cx="940" cy="40" r="1.1" opacity="0.5"/><circle cx="1020" cy="120" r="0.6" opacity="0.3"/>
    <circle cx="1100" cy="60" r="0.9" opacity="0.4"/><circle cx="1140" cy="220" r="0.7" opacity="0.35"/>
    <circle cx="80" cy="120" r="0.6" opacity="0.3"/><circle cx="340" cy="160" r="0.8" opacity="0.4"/>
    <circle cx="1160" cy="300" r="1" opacity="0.45"/><circle cx="40" cy="260" r="0.7" opacity="0.35"/>
    <circle cx="500" cy="200" r="0.6" opacity="0.25"/><circle cx="900" cy="180" r="0.7" opacity="0.3"/>
  </g>

  <ellipse cx="262" cy="166" rx="176" ry="128" fill="none" stroke="#7b5cff" stroke-opacity="0.14" stroke-width="1" transform="rotate(-18 262 166)"/>
  <ellipse cx="262" cy="166" rx="200" ry="150" fill="none" stroke="#9b8cff" stroke-opacity="0.08" stroke-width="1" transform="rotate(12 262 166)"/>

  <g>
    <circle cx="262" cy="166" r="205" fill="url(#aura)" filter="url(#b16)">
      <animate attributeName="r" values="198;212;198" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="262" cy="166" r="128" fill="url(#body)"/>
    <g clip-path="url(#orb)">
      <circle cx="262" cy="166" r="96" fill="url(#core)" filter="url(#b8)"/>
      <g>
        <ellipse cx="262" cy="140" rx="84" ry="60" fill="url(#bMag)" filter="url(#b12)" opacity="0.5"/>
        <ellipse cx="290" cy="186" rx="64" ry="48" fill="url(#bCyn)" filter="url(#b10)" opacity="0.62"/>
        <ellipse cx="236" cy="180" rx="50" ry="68" fill="url(#bVio)" filter="url(#b10)" opacity="0.45"/>
        <ellipse cx="272" cy="150" rx="42" ry="32" fill="url(#bBlu)" filter="url(#b8)" opacity="0.4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 262 166" to="360 262 166" dur="24s" repeatCount="indefinite"/>
      </g>
      <ellipse cx="226" cy="126" rx="44" ry="32" fill="url(#spec)" filter="url(#b5)"/>
    </g>
    <circle cx="262" cy="166" r="127" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-rendering="geometricPrecision">
    <text x="470" y="158" font-size="60" font-weight="700" fill="url(#title)" letter-spacing="-1.5">react-ai-orb</text>
    <rect x="472" y="174" width="380" height="2" fill="url(#rule)"/>
    <text x="472" y="204" font-size="23" font-weight="500" fill="#e6e0fb">A glowing animated orb for React</text>
    <text x="472" y="232" font-size="15" fill="#a89ed4">AI interfaces · assistants · chatbots · anywhere that needs a glowing orb</text>
    <text x="472" y="262" font-size="13" fill="#7e74a8" letter-spacing="0.4">React 19  ·  TypeScript  ·  CSS-only animation  ·  zero runtime deps</text>
  </g>

  <g>
    <circle cx="495" cy="306" r="9" fill="url(#p1)"/><circle cx="525" cy="306" r="9" fill="url(#p2)"/>
    <circle cx="555" cy="306" r="9" fill="url(#p3)"/><circle cx="585" cy="306" r="9" fill="url(#p4)"/>
    <circle cx="615" cy="306" r="9" fill="url(#p5)"/><circle cx="645" cy="306" r="9" fill="url(#p6)"/>
    <circle cx="675" cy="306" r="9" fill="url(#p7)"/><circle cx="705" cy="306" r="9" fill="url(#p8)"/>
    <text x="725" y="311" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6a62a0" letter-spacing="0.3">8 palettes · 8 presets</text>
  </g>
  <rect width="1200" height="340" fill="url(#vig)"/>
</svg>
