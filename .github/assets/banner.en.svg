<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="react-ai-orb — a glowing animated orb component for React">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#160c32"/><stop offset="50%" stop-color="#0a0518"/><stop offset="100%" stop-color="#04020c"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3a1e7e" stop-opacity="0.5"/><stop offset="100%" stop-color="#3a1e7e" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5a1e72" stop-opacity="0.4"/><stop offset="100%" stop-color="#5a1e72" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1e3a82" stop-opacity="0.32"/><stop offset="100%" stop-color="#1e3a82" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="60%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#000000" stop-opacity="0.55"/></radialGradient>

    <radialGradient id="body" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a594f4"/><stop offset="30%" stop-color="#5a44a8"/><stop offset="68%" stop-color="#241456"/><stop offset="100%" stop-color="#0a041e"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7b5cff" stop-opacity="0.55"/><stop offset="45%" stop-color="#5b3cd8" stop-opacity="0.18"/><stop offset="100%" stop-color="#5b3cd8" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c4b5ff" stop-opacity="0.4"/><stop offset="100%" stop-color="#c4b5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bMag" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d9d" stop-opacity="0.9"/><stop offset="100%" stop-color="#ff4d9d" stop-opacity="0"/></radialGradient>
    <radialGradient id="bCyn" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ad8ff" stop-opacity="0.9"/><stop offset="100%" stop-color="#4ad8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bVio" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#b388ff" stop-opacity="0.85"/><stop offset="100%" stop-color="#b388ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bBlu" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5b8bff" stop-opacity="0.8"/><stop offset="100%" stop-color="#5b8bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="45%" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c4b5ff" stop-opacity="0.7"/><stop offset="55%" stop-color="#7b5cff" stop-opacity="0.18"/><stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/></linearGradient>

    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#e3d9ff"/><stop offset="100%" stop-color="#a594f4"/></linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7b5cff" stop-opacity="0"/><stop offset="50%" stop-color="#7b5cff" stop-opacity="0.6"/><stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/></linearGradient>

    <radialGradient id="p1" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#9d8eff"/><stop offset="100%" stop-color="#3a2490"/></radialGradient>
    <radialGradient id="p2" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#3fe0d4"/><stop offset="100%" stop-color="#0a5a55"/></radialGradient>
    <radialGradient id="p3" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#ff9dc4"/><stop offset="100%" stop-color="#8e2a5e"/></radialGradient>
    <radialGradient id="p4" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#6a9bff"/><stop offset="100%" stop-color="#1a3a8e"/></radialGradient>
    <radialGradient id="p5" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#4ab0e8"/><stop offset="100%" stop-color="#0e4470"/></radialGradient>
    <radialGradient id="p6" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#5fe0a8"/><stop offset="100%" stop-color="#1a6e44"/></radialGradient>
    <radialGradient id="p7" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#ffd24a"/><stop offset="100%" stop-color="#8e6a1e"/></radialGradient>
    <radialGradient id="p8" cx="35%" cy="32%" r="70%"><stop offset="0%" stop-color="#ff8a5a"/><stop offset="100%" stop-color="#8e2e1a"/></radialGradient>

    <filter id="b24" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="b16" x="-55%" y="-55%" width="210%" height="210%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>

    <clipPath id="orb"><circle cx="262" cy="166" r="128"/></clipPath>
