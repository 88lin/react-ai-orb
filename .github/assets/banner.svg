<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="react-ai-orb banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d1c"/>
      <stop offset=".55" stop-color="#12122a"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="cornerGlow" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="rgba(91,124,255,.16)"/>
      <stop offset="1" stop-color="rgba(91,124,255,0)"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="rgba(255,255,255,.06)"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="620" height="300" fill="url(#cornerGlow)"/>

  <!-- 左：标题区 -->
  <text x="88" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#f4f4fa">react-ai-<tspan fill="#f4d758">orb</tspan></text>

  <rect x="90" y="150" width="188" height="44" rx="10" fill="#151821"/>
  <circle cx="110" cy="172" r="5" fill="#ff5f57"/>
  <circle cx="126" cy="172" r="5" fill="#febc2e"/>
  <circle cx="142" cy="172" r="5" fill="#28c840"/>
  <text x="160" y="178" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#c3c6d1">&lt;Orb /&gt;</text>

  <text x="90" y="238" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#c9c9e2">纯 CSS 动画的 AI 发光球 React 组件</text>
  <text x="90" y="272" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#7c7c9a">npm i react-ai-orb</text>

  <!-- 右：8 色调色板色卡 + 数据 -->
  <text x="1120" y="106" text-anchor="end" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#8c8caa">8 种内置调色板</text>
  <g>
    <circle cx="850"  cy="146" r="16" fill="#c77dff"/>
    <circle cx="902"  cy="146" r="16" fill="#40e0d0"/>
    <circle cx="954"  cy="146" r="16" fill="#ff9ec4"/>
    <circle cx="1006" cy="146" r="16" fill="#6a4fc4"/>
    <circle cx="1058" cy="146" r="16" fill="#2b7fd8"/>
    <circle cx="1110" cy="146" r="16" fill="#50c878"/>
    <circle cx="850"  cy="196" r="16" fill="#f4c95d"/>
    <circle cx="902"  cy="196" r="16" fill="#e8503a"/>
  </g>
  <text x="1120" y="260" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#5c5c78">8 presets · no WebGL · MIT</text>
</svg>
