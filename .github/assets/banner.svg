<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="react-ai-orb banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b18"/>
      <stop offset=".55" stop-color="#101024"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>

    <!-- oceanDepths 主球 -->
    <radialGradient id="mainBg" cx=".5" cy=".3" r=".75">
      <stop offset="0" stop-color="rgb(4,63,255)"/>
      <stop offset=".7" stop-color="rgb(17,19,82)"/>
      <stop offset="1" stop-color="rgb(8,10,45)"/>
    </radialGradient>
    <radialGradient id="shapeA" cx=".5" cy=".9" r=".8">
      <stop offset="0" stop-color="rgb(127,255,212)"/>
      <stop offset=".7" stop-color="rgba(0,105,148,0)"/>
    </radialGradient>
    <radialGradient id="shapeB" cx=".33" cy=".12" r=".75">
      <stop offset="0" stop-color="rgb(240,255,255)"/>
      <stop offset=".26" stop-color="rgb(64,224,208)"/>
      <stop offset=".63" stop-color="rgba(0,128,128,0)"/>
    </radialGradient>
    <radialGradient id="shapeC" cx=".31" cy=".12" r=".8">
      <stop offset="0" stop-color="rgba(224,255,255,0)"/>
      <stop offset=".31" stop-color="rgba(32,178,170,0)"/>
      <stop offset=".77" stop-color="#006064"/>
    </radialGradient>
    <radialGradient id="shapeD" cx=".12" cy=".8" r=".8">
      <stop offset="0" stop-color="rgba(224,255,255,0)"/>
      <stop offset=".31" stop-color="rgba(0,128,128,0)"/>
      <stop offset=".77" stop-color="#00838f"/>
    </radialGradient>

    <!-- cherryBlossom 中球 -->
    <radialGradient id="pinkMain" cx=".5" cy=".3" r=".75">
      <stop offset="0" stop-color="rgb(255,214,230)"/>
      <stop offset=".7" stop-color="rgb(158,78,124)"/>
      <stop offset="1" stop-color="rgb(74,32,62)"/>
    </radialGradient>
    <radialGradient id="pinkA" cx=".5" cy=".9" r=".8">
      <stop offset="0" stop-color="rgb(255,235,245)"/>
      <stop offset=".7" stop-color="rgba(255,150,190,0)"/>
    </radialGradient>
    <radialGradient id="pinkB" cx=".33" cy=".12" r=".75">
      <stop offset="0" stop-color="rgb(255,245,250)"/>
      <stop offset=".26" stop-color="rgb(255,140,180)"/>
      <stop offset=".63" stop-color="rgba(200,60,120,0)"/>
    </radialGradient>

    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4.6"/></filter>
    <filter id="shineBlur" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="66"/></filter>
    <filter id="shineBlurS" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="clipMain"><circle r="165"/></clipPath>
    <clipPath id="clipMid"><circle r="58"/></clipPath>

    <style>
      .tumble  { transform-box: fill-box; transform-origin: center;
        animation: tumble 14s linear infinite; }
      .tumble2 { transform-box: fill-box; transform-origin: center;
        animation: tumble 10s linear infinite; }
      .tumble3 { transform-box: fill-box; transform-origin: center;
        animation: tumble 7s linear infinite; }
      @keyframes tumble { to { transform: rotate3d(1, 1, 1, 360deg); } }
      .pulse  { transform-box: fill-box; transform-origin: center;
        animation: pulse 3.5s linear infinite; }
      .pulse2 { transform-box: fill-box; transform-origin: center;
        animation: pulse2 5s ease-in-out infinite; }
      @keyframes pulse  { 0% { transform: scale(.4); } 50% { transform: scale(.1); } 100% { transform: scale(.4); } }
      @keyframes pulse2 { 0% { transform: scale(.6); } 50% { transform: scale(.1); } 100% { transform: scale(.6); } }
      @media (prefers-reduced-motion: reduce) {
        .tumble, .tumble2, .tumble3, .pulse, .pulse2 { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="150" fill="rgba(0,96,128,.55)" filter="url(#halo)"/>
  <circle cx="1035" cy="92" r="80" fill="rgba(255,140,180,.35)" filter="url(#halo)"/>

  <!-- ============ 大球：oceanDepths，1:1 复刻组件图层 ============ -->
  <g transform="translate(200 150)">
    <!-- drop shadow: shadowColor2 -->
    <circle r="168" fill="rgba(0,96,128,.5)" filter="url(#halo)"/>
    <g clip-path="url(#clipMain)">
      <!-- orb-main 背景 -->
      <circle r="165" fill="url(#mainBg)"/>
      <!-- shape-a：青绿渐变球，3D 翻滚 -->
      <g class="tumble">
        <circle r="145" fill="url(#shapeA)"/>
      </g>
      <!-- shape-b：白→青，blur2，soft-light，1.5x -->
      <g class="tumble2" style="mix-blend-mode: soft-light" filter="url(#blur2)">
        <circle cx="-16.5" cy="-8.25" r="145" fill="url(#shapeB)"/>
      </g>
      <!-- shape-c：深青边缘，blur1，color-dodge，.65，2x -->
      <g class="tumble3" style="mix-blend-mode: color-dodge" opacity=".65" filter="url(#blur1)">
        <circle cx="-8.25" cy="-8.25" r="145" fill="url(#shapeC)"/>
      </g>
      <!-- shape-d：深青，blur1，color，.55，2.5x -->
      <g class="tumble2" style="mix-blend-mode: color" opacity=".55" filter="url(#blur1)">
        <circle cx="-8.25" cy="66" r="145" fill="url(#shapeD)"/>
      </g>
      <!-- blob-a：主色液态 blob，screen，.3，3x -->
      <g class="tumble3" style="mix-blend-mode: screen" opacity=".3" filter="url(#blur2)">
        <path fill="url(#mainBg)" d="M23.3,-31.9C28.4,-28.4,29.5,-19.2,31.1,-10.9C32.6,-2.6,34.7,4.7,33.5,11.7C32.3,18.6,27.8,25.3,21.6,28.8C15.5,32.3,7.8,32.6,-0.6,33.5C-9,34.4,-18.1,35.8,-24.8,32.5C-31.5,29.2,-35.9,21.2,-36.5,13.3C-37.2,5.4,-34.1,-2.4,-31.6,-10.4C-29.1,-18.3,-27.2,-26.6,-22.1,-30.1C-16.9,-33.6,-8.4,-32.3,0.3,-32.8C9.1,-33.3,18.2,-35.4,23.3,-31.9Z" transform="scale(3.6)"/>
      </g>
      <!-- blob-b：主色液态 blob，lighten，.8，3.5x -->
      <g class="tumble" style="mix-blend-mode: lighten" opacity=".8">
        <path fill="url(#mainBg)" d="M19.2,-27.1C25.6,-29.4,32.3,-26,33.8,-20.5C35.3,-15,31.7,-7.5,27.8,-2.2C23.9,3,19.8,6,16.8,8.9C13.8,11.8,11.9,14.6,9.3,18.8C6.7,23,3.3,28.6,-0.7,29.8C-4.7,31,-9.4,27.8,-16.7,26.2C-23.9,24.7,-33.6,24.8,-39.3,20.7C-45.1,16.7,-47,8.3,-45.4,0.9C-43.8,-6.5,-38.8,-13,-32.6,-16.3C-26.4,-19.6,-18.9,-19.7,-13.3,-17.9C-7.6,-16,-3.8,-12.2,1.3,-14.4C6.3,-16.6,12.7,-24.8,19.2,-27.1Z" transform="scale(3.6)"/>
      </g>
      <!-- blob-shine ×2：白色脉冲星芒，hard-light / plus-lighter -->
      <g class="pulse" style="mix-blend-mode: hard-light" filter="url(#shineBlur)">
        <path fill="#ffffff" d="M12.3,-22.8C17.4,-18.4,23.8,-17.9,26.8,-14.8C29.8,-11.6,29.5,-5.8,29,-0.3C28.6,5.3,28,10.6,26.9,17.1C25.9,23.7,24.3,31.5,19.7,32.2C15.2,32.8,7.6,26.3,0.6,25.3C-6.4,24.3,-12.9,28.9,-16.8,27.9C-20.8,26.9,-22.3,20.3,-23.8,14.7C-25.3,9.2,-26.9,4.6,-30.1,-1.8C-33.3,-8.3,-38.1,-16.5,-35.4,-20.1C-32.7,-23.6,-22.5,-22.4,-15.3,-25.5C-8.2,-28.6,-4.1,-36,-0.2,-35.6C3.6,-35.2,7.3,-27.1,12.3,-22.8Z" transform="scale(3.3)"/>
      </g>
      <g class="pulse2" style="mix-blend-mode: plus-lighter" opacity=".3" filter="url(#shineBlur)">
        <path fill="#ffffff" d="M12.3,-22.8C17.4,-18.4,23.8,-17.9,26.8,-14.8C29.8,-11.6,29.5,-5.8,29,-0.3C28.6,5.3,28,10.6,26.9,17.1C25.9,23.7,24.3,31.5,19.7,32.2C15.2,32.8,7.6,26.3,0.6,25.3C-6.4,24.3,-12.9,28.9,-16.8,27.9C-20.8,26.9,-22.3,20.3,-23.8,14.7C-25.3,9.2,-26.9,4.6,-30.1,-1.8C-33.3,-8.3,-38.1,-16.5,-35.4,-20.1C-32.7,-23.6,-22.5,-22.4,-15.3,-25.5C-8.2,-28.6,-4.1,-36,-0.2,-35.6C3.6,-35.2,7.3,-27.1,12.3,-22.8Z" transform="translate(24 -12) scale(3.3)"/>
      </g>
      <!-- glass：内高光 -->
      <circle r="145" fill="transparent" style="box-shadow: inset 0 -1px 12px 2px rgba(255,255,255,.5), inset 0 7px 8px 0 rgba(255,255,255,.5)"/>
      <circle r="165" fill="rgba(255,255,255,0)"/>
    </g>
  </g>

  <!-- ============ 中球：cherryBlossom ============ -->
  <g transform="translate(1035 92)">
    <circle r="60" fill="rgba(255,140,180,.45)" filter="url(#halo)"/>
    <g clip-path="url(#clipMid)">
      <circle r="58" fill="url(#pinkMain)"/>
      <g class="tumble3">
        <circle r="51" fill="url(#pinkA)"/>
      </g>
      <g class="tumble" style="mix-blend-mode: soft-light" filter="url(#blur1)">
        <circle cx="-5.8" cy="-2.9" r="51" fill="url(#pinkB)"/>
      </g>
      <g class="pulse" style="mix-blend-mode: hard-light" filter="url(#shineBlurS)">
        <path fill="#ffffff" d="M12.3,-22.8C17.4,-18.4,23.8,-17.9,26.8,-14.8C29.8,-11.6,29.5,-5.8,29,-0.3C28.6,5.3,28,10.6,26.9,17.1C25.9,23.7,24.3,31.5,19.7,32.2C15.2,32.8,7.6,26.3,0.6,25.3C-6.4,24.3,-12.9,28.9,-16.8,27.9C-20.8,26.9,-22.3,20.3,-23.8,14.7C-25.3,9.2,-26.9,4.6,-30.1,-1.8C-33.3,-8.3,-38.1,-16.5,-35.4,-20.1C-32.7,-23.6,-22.5,-22.4,-15.3,-25.5C-8.2,-28.6,-4.1,-36,-0.2,-35.6C3.6,-35.2,7.3,-27.1,12.3,-22.8Z" transform="scale(1.15)"/>
      </g>
      <circle r="51" fill="transparent" style="box-shadow: inset 0 -1px 6px 1px rgba(255,255,255,.5), inset 0 3px 4px 0 rgba(255,255,255,.5)"/>
    </g>
  </g>

  <circle cx="962" cy="224" r="14" fill="url(#pinkMain)"/>
  <circle cx="1106" cy="220" r="18" fill="url(#pinkA)"/>

  <text x="612" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#f4f4fa">react-ai-<tspan fill="#f4d758">orb</tspan></text>
  <text x="612" y="205" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" fill="#c9c9e2">纯 CSS 动画的 AI 发光球 React 组件</text>
  <text x="612" y="248" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#7c7c9a">Pure CSS · No WebGL · TypeScript-first · 8 palettes · 8 presets</text>
</svg>
